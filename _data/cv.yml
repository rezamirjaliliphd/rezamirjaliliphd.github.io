    - title: Research Assistant
      institution: Systems Optimization and Computing Laboratory (SOCL), University of Houston
      year: 2020 - 2025
      description:
        - Developed a branch-and-price-and-cut algorithm for the Mothership Drone Routing Problem, introducing
          valid inequalities that improved LP bounds by 5-10%.
        - Proposed a bound-inference strategy that reduced pricing model calls and improved convergence by 18-50%.
        - Applied deep reinforcement learning to prioritize pricing subproblems in column generation,
          accelerating convergence by 20-30%.
